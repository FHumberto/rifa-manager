name: Backend CI

on:
  pull_request:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-ci.yml"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-and-test:
    name: Build and test backend
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "10.0.x"

      - name: Restore
        run: dotnet restore backend/RifaManager.slnx

      - name: Build
        run: dotnet build backend/RifaManager.slnx --configuration Release --no-restore

      - name: Test
        run: dotnet test backend/RifaManager.slnx --configuration Release --no-build --verbosity normal
